[project]
name = "openagentmesh"
version = "0.2.1"
description = "Python SDK for agent-to-agent communication based on the Open Agent Mesh Protocol"
readme = "README.md"
authors = [
    { name = "Luca Sorgiacomo", email = "luca@progresslab.it" }
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "nats-py>=2.14.0",
    "nkeys>=0.2.1",
    "pydantic>=2.12.5",
    "typer>=0.24.1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.20",
]

# Wildfire scenario UI dashboard backend. Lives at demos/wildfire/dashboard/
# and runs uvicorn programmatically. Demo-scoped: the SDK itself never
# imports FastAPI.
wildfire-dashboard = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
oam = "openagentmesh.cli:app"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
    "zensical>=0.0.32",
    "mcp>=1.20",
    # Wildfire dashboard backend — pulled into dev so `uv run pytest` exercises
    # the FastAPI app without `--extra wildfire-dashboard`.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",  # FastAPI TestClient backend
    # Wildfire LLM peers (briefer/tasker/narrator) reach OpenRouter through the
    # openai client; demo-scoped, the SDK never imports it. In dev so pytest
    # collects the peers' unit tests without extra flags.
    "openai>=1.60",
]
demo = [
    "openai>=1.60",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["openagentmesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ty.environment]
python = ".venv"

# ADR-0031 streamer convention: a streaming handler is an async generator whose
# return annotation names the CHUNK type (used for schema inference), not
# AsyncIterator[Chunk]. Tests and demos follow that documented convention, so
# the resulting invalid-return-type diagnostics are suppressed there.
[[tool.ty.overrides]]
include = ["tests/**", "src/openagentmesh/demos/**", "demos/**"]

[tool.ty.overrides.rules]
invalid-return-type = "ignore"
