[project]
name = "openagentmesh"
version = "0.2.1"
description = "Python SDK for agent-to-agent communication based on the Open Agent Mesh Protocol"
readme = "README.md"
authors = [
    { name = "Luca Sorgiacomo", email = "luca@progresslab.it" }
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "nats-py>=2.14.0",
    "pydantic>=2.12.5",
    "typer>=0.24.1",
]

[project.optional-dependencies]
# Admin UI extra. Empty per ADR-0056 amendment: the static-asset server
# is stdlib http.server (no third-party HTTP framework at runtime).
# Frontend bundle ships at src/openagentmesh/_ui_assets/ via the wheel.
# The namespace is claimed now so future enterprise/remote-auth deps
# land here.
ui = []

# Wildfire scenario UI dashboard backend (Phase 2 / D-25 / D-37 / D-38).
# Lives at demos/wildfire/dashboard/ and runs uvicorn programmatically.
# These deps are demo-scoped: the SDK itself does not import FastAPI.
wildfire-dashboard = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
oam = "openagentmesh.cli:app"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
    "zensical>=0.0.32",
    # Phase 2 dashboard backend — pulled in for tests so `uv run pytest` exercises
    # the FastAPI app without requiring a separate `--extra wildfire-dashboard`.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",  # FastAPI TestClient backend
    # Phase 3 LLM peers (briefer/tasker/narrator) — anthropic client is
    # demo-scoped; the SDK itself never imports it. In dev so `uv run pytest`
    # collects the peers' unit tests without extra flags.
    "anthropic>=0.116.0",
]
demo = [
    "anthropic>=0.116.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["openagentmesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ty.environment]
python = ".venv"
